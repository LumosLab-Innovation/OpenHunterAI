services:
  orchestrator:
    build:
      context: ../..
      dockerfile: workers/orchestrator/Dockerfile
    env_file:
      - ../../workers/orchestrator/env/orchestrator.env.example
    environment:
      NATS_URL: nats://nats:4222
      INTERNAL_API_URL: http://internal-api:4100
      FINDINGS_URL: http://findings:4300
      REPORTING_URL: http://reporting:4400
    ports:
      - "5100:5100"

  browser-inspector:
    build:
      context: ../..
      dockerfile: workers/browser-inspector/Dockerfile
    env_file:
      - ../../workers/browser-inspector/env/browser-inspector.env.example
    ports:
      - "5110:5110"

  Z:
    build:
      context: ../..
      dockerfile: workers/Z/Dockerfile
    env_file:
      - ../../workers/Z/env/Z.env.example
    ports:
      - "5120:5120"

  N:
    build:
      context: ../..
      dockerfile: workers/N/Dockerfile
    env_file:
      - ../../workers/N/env/N.env.example
    ports:
      - "5130:5130"

  O:
    build:
      context: ../..
      dockerfile: workers/O/Dockerfile
    env_file:
      - ../../workers/O/env/O.env.example
    ports:
      - "5140:5140"

  S:
    build:
      context: ../..
      dockerfile: workers/S/Dockerfile
    env_file:
      - ../../workers/S/env/S.env.example
    ports:
      - "5150:5150"

  retest:
    build:
      context: ../..
      dockerfile: workers/retest/Dockerfile
    env_file:
      - ../../workers/retest/env/retest.env.example
    ports:
      - "5160:5160"
