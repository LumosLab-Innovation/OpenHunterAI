services:
  postgres:
    image: postgres:16
    env_file:
      - ../../infra/env/core.env.example
    environment:
      POSTGRES_USER: xhunter
      POSTGRES_PASSWORD: xhunter
      POSTGRES_DB: xhunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data

  minio:
    image: minio/minio
    env_file:
      - ../../infra/env/core.env.example
    environment:
      MINIO_ROOT_USER: xhunter
      MINIO_ROOT_PASSWORD: xhunter1234
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata: {}
  natsdata: {}
  miniodata: {}
