services:
  postgres:
    image: postgres:16
    env_file:
      - ../../infra/env/core.env.example
    environment:
      POSTGRES_USER: xhunter
      POSTGRES_PASSWORD: xhunter
      POSTGRES_DB: xhunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data

volumes:
  pgdata: {}
  natsdata: {}
