# Local development stack for X-hunter AI v1.
#
# Bring up: docker compose -f infra/docker-compose.yml up -d
# Then:     pnpm db:migrate && pnpm db:seed
#           pnpm dev:api  (in one shell)
#           pnpm dev:web  (in another)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: xhunter
      POSTGRES_PASSWORD: xhunter
      POSTGRES_DB: xhunter
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: ['6379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data

  # Optional: a self-hosted ZAP daemon. Disabled by default — workers will
  # gracefully skip ZAP if it's not configured.
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ['zap']
    command:
      [
        'zap.sh',
        '-daemon',
        '-host',
        '0.0.0.0',
        '-port',
        '8080',
        '-config',
        'api.disablekey=false',
        '-config',
        'api.key=${ZAP_API_KEY:-changeme}',
        '-config',
        'api.addrs.addr.name=.*',
        '-config',
        'api.addrs.addr.regex=true',
      ]
    ports: ['8090:8080']

  minio:
    image: minio/minio
    profiles: ['minio']
    environment:
      MINIO_ROOT_USER: xhunter
      MINIO_ROOT_PASSWORD: xhunter1234
    ports: ['9000:9000', '9001:9001']
    command: ['server', '/data', '--console-address', ':9001']
    volumes: [miniodata:/data]

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
