asyncapi: 3.0.0
info:
  title: OpenHunter Events
  version: 0.1.0
channels:
  scan.created:
    address: scan.created
    messages:
      scanCreated:
        payload:
          type: object
          required: [scanId, projectId, authorizationId, mode, scope]
  retest.requested:
    address: retest.requested
    messages:
      retestRequested:
        payload:
          type: object
          required: [retestRunId, findingId]
