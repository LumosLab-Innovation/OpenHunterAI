openapi: 3.0.3
info:
  title: OpenHunter Public API
  version: 0.1.0
paths:
  /v1/auth/signin:
    post:
      responses:
        "200":
          description: Signed in
  /v1/projects:
    get:
      responses:
        "200":
          description: Project list
    post:
      responses:
        "200":
          description: Project created
  /v1/projects/{id}/scans:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan queued
  /v1/scans/{id}/report-draft:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current structured report draft sections
  /v1/scans/{id}/report-events:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-sent report draft updates
  /v1/reports/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Final or draft report snapshot with latest overlay
  /v1/reports/{id}/export:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [docx, csv, json, html, pdf]
            default: html
        - name: view
          in: query
          schema:
            type: string
            enum: [snapshot, latest]
            default: latest
      responses:
        "200":
          description: On-demand sanitized final or superseded report download; Content-Disposition attachment. JSON contains snapshot and optional latestOverlay. CSV separates findings, hardening, coverage gaps, and limitations.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot]
                properties:
                  snapshot:
                    type: object
                  latestOverlay:
                    type: object
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Unsupported format/view, or report is not finalized
        "401":
          description: Authentication required
        "404":
          description: Report does not exist in the current organization
