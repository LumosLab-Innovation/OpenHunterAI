openapi: 3.0.3
info:
  title: OpenHunter Public API
  version: 0.1.0
  description: |
    Local mode is single-user and loopback-only, without workspace login or session
    cookies. Hosted mode retains authentication. Both modes enforce target ownership,
    scan scope and approvals. See docs/LOCAL_WORKSPACE.md.
paths:
  /v1/workspace:
    get:
      summary: Discover local or hosted workspace mode
      responses:
        "200":
          description: Workspace mode (no credentials)
          content:
            application/json:
              schema:
                type: object
                required: [mode]
                properties:
                  mode:
                    type: string
                    enum: [local, hosted]
        "403":
          description: Local request boundary rejected the Host or Origin
  /v1/workspace/status:
    get:
      summary: Workspace connection and model configuration status
      description: |
        Requires a session in hosted mode; bootstraps the isolated operator in local
        mode. Reports API/database/queue connectivity and model-key presence, not
        completed scan coverage or validated provider access. Never returns raw keys.
      responses:
        "200":
          description: Workspace, operator, service connectivity and model metadata
        "401":
          description: Hosted session required
        "403":
          description: Local request boundary rejected the Host or Origin
  /v1/auth/signin:
    post:
      description: Hosted mode only; this route is not mounted in local mode.
      responses:
        "200":
          description: Signed in
  /v1/projects:
    get:
      responses:
        "200":
          description: Project list
    post:
      responses:
        "200":
          description: Project created
  /v1/projects/{id}/scans:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan queued
  /v1/scans/{id}/report-draft:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current structured report draft sections
  /v1/scans/{id}/report-events:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-sent report draft updates
  /v1/reports/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Final or draft report snapshot with latest overlay
  /v1/reports/{id}/export:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [docx, csv, json, html, pdf]
            default: html
        - name: view
          in: query
          schema:
            type: string
            enum: [snapshot, latest]
            default: latest
      responses:
        "200":
          description: On-demand sanitized final or superseded report download; Content-Disposition attachment. JSON contains snapshot and optional latestOverlay. CSV separates findings, hardening, coverage gaps, and limitations.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot]
                properties:
                  snapshot:
                    type: object
                  latestOverlay:
                    type: object
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Unsupported format/view, or report is not finalized
        "401":
          description: Authentication required
        "404":
          description: Report does not exist in the current organization
