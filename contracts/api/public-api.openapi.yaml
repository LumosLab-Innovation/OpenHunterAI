openapi: 3.0.3
info:
  title: OpenHunter Public API
  version: 0.1.0
paths:
  /v1/auth/signin:
    post:
      responses:
        "200":
          description: Signed in
  /v1/projects:
    get:
      responses:
        "200":
          description: Project list
    post:
      responses:
        "200":
          description: Project created
  /v1/projects/{id}/scans:
    post:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan queued
  /v1/scans/{id}/report-draft:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current structured report draft sections
  /v1/scans/{id}/report-events:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-sent report draft updates
  /v1/reports/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Final or draft report snapshot with latest overlay
  /v1/reports/{id}/export:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            enum: [html, pdf]
        - name: view
          in: query
          schema:
            enum: [snapshot, latest]
      responses:
        "200":
          description: On-demand sanitized HTML/PDF export
