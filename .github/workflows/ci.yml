name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: service checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install TypeScript services
        run: make install

      - name: Generate Prisma client
        run: make db-generate

      - name: Typecheck TypeScript services
        run: make typecheck

      - name: Test TypeScript services
        run: make test

      - name: Build Go services
        run: make go-build
